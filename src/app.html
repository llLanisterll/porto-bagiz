<!doctype html>
<html lang="id" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>
		<title>Muhammad Baghiz — Lead Product Designer & Business Strategist</title>
		<meta
			name="description"
			content="Portofolio Muhammad Baghiz — Lead Product Designer & Business Strategist yang menghubungkan estetika desain intuitif dengan dampak strategi bisnis terukur."
		/>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (stored === 'dark' || (!stored && prefersDark)) {
						document.documentElement.classList.add('dark');
						document.documentElement.setAttribute('data-theme', 'dark');
						document.documentElement.style.colorScheme = 'dark';
					} else {
						document.documentElement.classList.remove('dark');
						document.documentElement.setAttribute('data-theme', 'light');
						document.documentElement.style.colorScheme = 'light';
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body class="antialiased" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
